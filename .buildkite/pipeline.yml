# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Throwaway: only the release-path validation runs on this branch.

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: ":apple: Validate release build, signing and dSYM upload on xcode-27.2-v3"
    command: RBENV_VERSION=3.4.13 .buildkite/commands/validate-release-path.sh
    agents:
      queue: mac
    plugins: [$CI_TOOLKIT]
    artifact_paths:
      - artifacts/validation/*
