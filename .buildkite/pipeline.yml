# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Validation pipeline. Build the App Store IPA and scan it.
# There is no TestFlight, GitHub release, prototype, or tvOS upload step.

env:
  IMAGE_ID: $IMAGE_ID

steps:
  - label: "Scan release binary"
    command: .buildkite/commands/validate-release-binary-scan.sh
    agents:
      queue: mac
    plugins: [$CI_TOOLKIT]
    artifact_paths:
      - artifacts/release-binary-scan.txt
